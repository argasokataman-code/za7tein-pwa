name: Deploy production

# Deploy otomatis ke Vercel tiap push ke `main`. Menggantikan `vercel --prod`
# manual dari laptop (yang meng-upload working tree, termasuk berkas belum
# ke-commit). Di sini yang ter-deploy adalah revisi commit yang sudah di-push,
# jadi prod selalu cocok dengan `git`.
#
# Secret yang dibutuhkan (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — token Vercel (Account → Tokens)
#   VERCEL_ORG_ID      — ada di `.vercel/project.json`
#   VERCEL_PROJECT_ID  — ada di `.vercel/project.json`
#
# Semua project-domain (sa7tein-c/m/k/a/hub/pwa) ikut ter-assign otomatis oleh
# `vercel --prod`, jadi tak ada langkah alias manual lagi.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Satu deploy prod pada satu waktu; jangan batalkan yang sedang jalan supaya
# tidak ada dua promote bertumpuk.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (lint + build)
        run: ./scripts/verify.sh

      - name: Surface scan (statik)
        run: npm run scan

      - name: Deploy ke Vercel (production)
        run: npx --yes vercel@54 --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
