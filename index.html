<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F15A37" />
    <meta name="description" content="Marketplace makanan hyperlocal Sa7tein di Irbid" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sa7tein" />
    <link rel="manifest" id="app-manifest" href="/manifest.json" />
    <script>
      // Manifest per peran: tiap prefix punya identitas sendiri supaya bisa
      // diinstall sebagai aplikasi terpisah dari situs dan dari peran lain.
      // `/superadmin` sengaja TIDAK di sini: konsol itu website penuh non-PWA
      // (keputusan PO 2026-09-23), jadi manifest-nya dilepas supaya browser
      // tidak menawarkan install.
      (function () {
        var names = { customer: 'Sa7tein', merchant: 'Sa7tein Merchant', courier: 'Sa7tein Kurir', admin: 'Sa7tein Admin' };
        // Judul jendela app-mode Chromium diambil dari `<title>` dokumen, bukan
        // `name` manifest — tanpa ini empat jendela tampil dengan judul identik
        // dan tidak bisa dibedakan. Peran customer cukup "Sa7tein".
        var titles = { customer: 'Sa7tein — Marketplace Makanan Hyperlocal', merchant: 'Sa7tein Merchant — Sa7tein', courier: 'Sa7tein Kurir — Sa7tein', admin: 'Sa7tein Admin — Sa7tein' };
        if (location.pathname === '/superadmin' || location.pathname.indexOf('/superadmin/') === 0) {
          var link = document.getElementById('app-manifest');
          if (link) link.parentNode.removeChild(link);
          document.documentElement.setAttribute('data-role', 'superadmin');
          document.title = 'Sa7tein Super Admin';
          return;
        }
        var roles = Object.keys(names);
        for (var i = 0; i < roles.length; i++) {
          var role = roles[i];
          if (location.pathname === '/' + role || location.pathname.indexOf('/' + role + '/') === 0) {
            document.getElementById('app-manifest').setAttribute('href', '/manifest-' + role + '.json');
            document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', names[role]);
            document.documentElement.setAttribute('data-role', role);
            document.title = titles[role];
            break;
          }
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icons/sa7tein-mark.svg" />
    <link rel="apple-touch-icon" href="/icons/sa7tein-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/sa7tein-152x152.png" />
    <style>
      #boot-splash[hidden] { display: none; }
      /* Splash ditutup lewat kelas ini, bukan `remove()`: kegagalan ikon di
         bawah tidak boleh memblokir penutupan (lihat App.tsx). */
      #boot-splash.boot-done { display: none; }
      #boot-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #FFF9F4; color: #202020; font-family: system-ui, sans-serif; }
      #boot-splash .boot-inner { display: grid; justify-items: center; gap: 16px; padding: 24px; text-align: center; }
      #boot-splash img { width: 80px; height: 80px; border-radius: 12px; }
      #boot-splash strong { font-size: 24px; letter-spacing: -0.03em; }
      #boot-splash .boot-progress { width: 72px; height: 4px; overflow: hidden; border-radius: 9999px; background: #EDE4DC; }
      #boot-splash .boot-progress::after { content: ''; display: block; width: 36px; height: 100%; border-radius: inherit; background: #F15A37; animation: boot-move 1.1s ease-in-out infinite alternate; }
      @keyframes boot-move { to { transform: translateX(36px); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .boot-progress::after { animation: none; width: 72px; } }
    </style>
    <title>Sa7tein — Marketplace Makanan Hyperlocal</title>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Membuka Sa7tein" hidden>
      <div class="boot-inner">
        <img src="/icons/sa7tein-192x192.png" alt="" />
        <strong>Sa7tein</strong>
        <span class="boot-progress" aria-hidden="true"></span>
      </div>
    </div>
    <script>
      if (['/customer', '/merchant', '/courier', '/admin'].some(function (base) {
        return location.pathname === base || location.pathname.startsWith(base + '/');
      })) {
        document.getElementById('boot-splash').hidden = false;
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
