<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Ukur irisan beta · 390 × 844</title>
<!--
  ALAT UKUR, bukan layar. Dibuka lewat server statis, bukan server Vite:

    python3 -m http.server 9377 --bind 127.0.0.1
    open http://127.0.0.1:9377/docs/design/slice/beta/_measure.html?page=masuk

  Kenapa ada: `browser-gate` hanya mengukur aplikasi React. Berkas di folder ini
  statis, jadi bingkai 390 × 844 di bawah ini yang menjadi acuan ukur — lebar
  bingkai sama dengan `--shell-max` repo, dan tidak ada gulir horizontal di
  dalamnya. Skrip Vite tidak dipakai karena ia menyajikan `.css` sebagai modul
  JS sehingga lembar gaya tidak terpasang dan semua angka jadi palsu.

  Halaman mengisi `?page=` dengan nama berkas di `auth/`.
-->
<style>
  html, body { margin: 0; background: #222; }
  /* Tinggi 1000 (bukan 844) supaya seluruh bingkai + keterangan muat di
     viewport ukur, jadi hit-test `elementFromPoint` tidak mengembalikan null
     hanya karena tombolnya berada di luar bidang pandang. */
  iframe { display: block; width: 390px; height: 1000px; border: 0; margin: 0 auto; background: #fff; }
</style>
</head>
<body>
<iframe id="f" src="auth/masuk.html" title="Irisan terukur"></iframe>
<script>
  const page = new URLSearchParams(location.search).get('page') || 'masuk'
  // `page` tanpa garis miring = berkas di `auth/`; `page` berisi garis miring
  // dipakai apa adanya, mis. `?page=verifikasi/merchant` atau `?page=akun/akun`.
  document.getElementById('f').src = page.includes('/') ? page + '.html' : 'auth/' + page + '.html'
</script>
</body>
</html>
