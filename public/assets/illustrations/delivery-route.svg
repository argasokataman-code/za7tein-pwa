  <path d="M111 -10V310M222 -10V310M330 -10V310M-10 80H490M-10 164H490M-10 241H490" class="road-edge"/>
  <path d="M111 -10V310M222 -10V310M330 -10V310M-10 80H490M-10 164H490M-10 241H490" class="road"/>
  <path d="M9 45h92M129 222h77M347 132h105M271 246v45" class="minor"/>
  <path d="M72 242H111V164H222V80H330H404" class="route-back"/>
  <path d="M72 242H111V164H222V80H330H404" class="route"/>
  <path d="M72 242H111V164H222V80H330H404" class="route-glint"/>
  <path d="M72 220c-13 0-24 10-24 23 0 18 24 39 24 39s24-21 24-39c0-13-11-23-24-23z" class="pin"/><circle cx="72" cy="243" r="7" class="pin-center"/>
  <path d="M404 52c-15 0-27 12-27 27 0 19 27 43 27 43s27-24 27-43c0-15-12-27-27-27z" class="pin"/><path d="M394 83v-8l10-8 10 8v8h-20m7 0v-7h6v7" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="255" cy="142" r="21" class="courier"/><circle cx="255" cy="142" r="28" class="pulse"/><circle cx="255" cy="142" r="35" class="pulse" style="animation-delay:.7s"/><path d="M245 148h20m-15 0 5-10 5 10m-11-13h4" fill="none" stroke="#F15A37" stroke-width="2.5" stroke-linecap="round"/><circle cx="246" cy="151" r="3" class="courier-dot"/><circle cx="264" cy="151" r="3" class="courier-dot"/>
</svg>
