<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
  <title id="title">Perjalanan kurir dari toko menuju rumah</title>
  <desc id="desc">Peta ilustratif: jalur oranye mengikuti jalan dari toko di kiri bawah ke rumah di kanan atas.</desc>
  <style>
    .ground{fill:#F7F4EF}.block{fill:#EDE8E1}.block2{fill:#E7E2DA}.park{fill:#D9EBD9}
    .road-edge{fill:none;stroke:#E2DBD1;stroke-width:19;stroke-linecap:round;stroke-linejoin:round}
    .road{fill:none;stroke:#fff;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
    .minor{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round}
    .route-back{fill:none;stroke:#fff;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
    .route{fill:none;stroke:#F15A37;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .route-glint{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-dasharray:5 15;animation:travel 1.2s linear infinite}
    .pin{fill:#F15A37;stroke:#fff;stroke-width:4}.pin-center{fill:#fff}
    .courier{fill:#fff;stroke:#F15A37;stroke-width:4}.courier-dot{fill:#F15A37}
    .pulse{fill:none;stroke:#F15A37;stroke-width:3;transform-origin:255px 142px;animation:pulse 2.4s ease-out infinite}
    @keyframes travel{to{stroke-dashoffset:-20}}@keyframes pulse{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.7)}}
    @media(prefers-reduced-motion:reduce){.route-glint,.pulse{animation:none}.pulse{opacity:0}}
  </style>
